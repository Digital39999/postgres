# Connection Settings
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Checkpoints
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
checkpoint_warning = 30s

# WAL Settings
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
wal_buffers = 16MB

# Optimizer settings
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Connections and security
max_connections = 200
listen_addresses = '*'

# Autovacuum
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 10s
autovacuum_vacuum_cost_delay = 20ms

# Other performance settings
synchronous_commit = off
# full_page_writes = off risks torn-page corruption on a crash unless your
# storage guarantees atomic block writes (most Docker volume drivers do not).
# Kept on for safety; only disable if you specifically understand the tradeoff.
full_page_writes = on

# Logging
log_min_duration_statement = 250ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '
log_lock_waits = on
