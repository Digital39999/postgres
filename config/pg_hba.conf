# TYPE  DATABASE        USER            ADDRESS                 METHOD
# NOTE: 0.0.0.0/0 accepts connections from anywhere the port is reachable.
# Fine for a quick deploy behind your own firewall/VPC; for public-facing
# hosts, restrict ADDRESS to known IP ranges instead.
local   all             all                                      scram-sha-256
host    all             all             0.0.0.0/0                scram-sha-256
host    all             all             ::0/0                    scram-sha-256

local   replication     all                                      scram-sha-256
host    replication     all             0.0.0.0/0                scram-sha-256
host    replication     all             ::0/0                    scram-sha-256
