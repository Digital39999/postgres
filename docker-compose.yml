services:
  postgres:
    build: .
    container_name: postgres
    network_mode: bridge
    restart: always
    env_file:
      - stack.env
    shm_size: 256mb
    ports:
      - 62909:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: