version: '3.8'

services:
  postgres:
    build: .
    container_name: postgres
    network_mode: bridge
    restart: always
    env_file:
      - stack.env
    ports:
      - 62909:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.17.0
    container_name: pgbouncer
    depends_on:
      - postgres
    ports:
      - 28477:6432
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    restart: always

volumes:
  postgres_data:
